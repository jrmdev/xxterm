[package]
name = "xxterm"
version = "1.3.0"
description = "xxterm - cross-platform terminal emulator"
authors = ["you"]
edition = "2021"

[lib]
name = "xxterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
ring = "0.17"
dirs = "5"
chrono = "0.4"
futures = "0.3"
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "io-util", "net", "time"] }
anyhow = "1"
russh-sftp = "2.1"
font-kit = "0.14"
arboard = "3"
