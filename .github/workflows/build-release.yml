name: Build releases

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    env:
      CARGO_NET_RETRY: 10

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            runner: ubuntu-latest
            os: linux
            arch: x64
            binary: xxterm
          - name: macos
            runner: macos-latest
            os: macos
            arch: x64
            binary: xxterm
          - name: windows
            runner: windows-latest
            os: windows
            arch: x64
            binary: xxterm.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked --manifest-path src-tauri/Cargo.toml; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 30))
          done

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable binary
        run: npm run tauri -- build --no-bundle

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release
          cp "src-tauri/target/release/${{ matrix.platform.binary }}" "release/${{ matrix.platform.binary }}"

      - name: Zip Linux release
        if: runner.os == 'Linux'
        run: |
          cd release
          zip "../xxterm_${{ github.ref_name }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.zip" "${{ matrix.platform.binary }}"

      - name: Zip macOS release
        if: runner.os == 'macOS'
        run: |
          cd release
          zip "../xxterm_${{ github.ref_name }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.zip" "${{ matrix.platform.binary }}"

      - name: Zip Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "release/${{ matrix.platform.binary }}" -DestinationPath "xxterm_${{ github.ref_name }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.zip" -Force

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v6
        with:
          name: xxterm_${{ github.ref_name }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.zip
          path: xxterm_${{ github.ref_name }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download zipped artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist-artifacts/*.zip --clobber
          else
            gh release create "${{ github.ref_name }}" dist-artifacts/*.zip \
              --title "${{ github.ref_name }}" \
              --notes "Automated xxterm release for ${{ github.ref_name }}."
          fi
